<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>JP Wedge Fitting</title><style>
*{box-sizing:border-box}body{margin:0;background:#070707;color:#f5f3ed;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;min-height:100vh}body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 20% 10%,rgba(255,255,255,.09),transparent 28%),linear-gradient(135deg,#090909,#1a1a1a 55%,#050505);z-index:-2}body:after{content:"";position:fixed;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.08),rgba(0,0,0,.72));z-index:-1}.app{min-height:100vh;padding:22px}.top{display:flex;gap:18px;align-items:center;max-width:1180px;margin:auto}.brand{font:700 32px Georgia,serif;letter-spacing:.14em}.line{height:1px;background:#484848;flex:1}.langs{display:flex;gap:6px}.langs button{background:#0d0d0d;color:#ddd;border:1px solid #444;padding:9px 12px;cursor:pointer}.langs button.on{background:#eee8dc;color:#111}.progress{max-width:1180px;margin:18px auto 0;height:3px;background:#282828}.progress i{display:block;height:100%;background:#eee8dc;width:11.1%;transition:.2s}.panel,.result{max-width:1080px;margin:9vh auto 0;background:rgba(8,8,8,.72);border:1px solid #3d3d3d;padding:28px;backdrop-filter:blur(10px)}.ey{font-size:12px;letter-spacing:.18em;color:#b9b6ad;text-transform:uppercase}.step{font-size:11px;color:#aaa}.panel h1,.result h1{font:400 48px Georgia,serif;line-height:1.15;margin:16px 0}.desc{color:#b7b4ad;line-height:1.65}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:22px}.choice{padding:18px;border:1px solid #3f3f3f;background:#141414;color:#eee;text-align:left;cursor:pointer}.choice.sel{background:#eee8dc;color:#111;border-color:#eee8dc}.choice b{display:block;font-size:18px;margin-bottom:5px}.input{width:100%;background:#111;border:1px solid #444;color:#fff;padding:15px;font-size:20px}.select{width:100%;background:#111;border:1px solid #444;color:#fff;padding:15px;font-size:18px}.actions{max-width:1080px;margin:18px auto;display:flex;justify-content:space-between}.actions button{padding:14px 22px;border:1px solid #555;background:#121212;color:#eee;font-weight:700;cursor:pointer}.actions .next{background:#eee8dc;color:#111;border-color:#eee8dc}.matrix{overflow:auto;margin-top:20px}table{width:100%;border-collapse:collapse;min-width:700px}th,td{border-bottom:1px solid #333;padding:12px;text-align:center}th{color:#aaa;font-size:11px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:18px}.card,.box{border:1px solid #343434;background:rgba(255,255,255,.03);padding:18px}.loft{font-size:42px;font-weight:800}.bounce{display:inline-block;margin-top:8px;padding:7px 10px;border:1px solid #555;font-size:12px;letter-spacing:.12em}.barrow{display:grid;grid-template-columns:70px 1fr 70px;gap:10px;align-items:center;margin:10px 0}.bar{height:14px;background:#222;border:1px solid #383838}.bar span{display:block;height:100%;background:linear-gradient(90deg,#765d39,#d2b178)}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:16px}.metric{border:1px solid #333;padding:14px}.metric small{color:#aaa}.metric b{display:block;font-size:24px;margin-top:4px}.tag{display:inline-block;border:1px solid #444;padding:8px 10px;margin:4px;color:#ddd}.note{font-size:12px;color:#9f9b92;line-height:1.55}.hidden{display:none}@media(max-width:700px){.panel,.result{margin-top:5vh;padding:20px}.panel h1,.result h1{font-size:34px}.top{align-items:flex-start}.brand{font-size:24px}.langs{flex-wrap:wrap;justify-content:flex-end}.actions{padding:0 4px}}
</style></head><body><div class="app"><div class="top"><div class="brand">JP GOLF</div><div class="line"></div><div class="langs"><button data-l="en" onclick="setLang('en')">EN</button><button data-l="ko" onclick="setLang('ko')">한국어</button><button data-l="ja" onclick="setLang('ja')">日本語</button><button data-l="zh" onclick="setLang('zh')">中文</button></div></div><div class="progress"><i id="bar"></i></div><div id="panel" class="panel"></div><div id="actions" class="actions"><button id="back" onclick="prev()"></button><button class="next" id="next" onclick="next()"></button></div><div id="result" class="result hidden"></div></div><script>
const DB={"JP Premier":{lofts:[46,48,50,52,54,55,56,58,60]},"JP Camber":{lofts:[48,50,52,54,55,56,58,60]}};
const I={en:{back:'← Back',next:'Next',p1:'Which JP Wedge would you like to fit?',p2:'How many wedges would you like?',p3:'What is your average score?',p4:'What is your current pitching wedge loft?',p5:'What is the highest loft you want to carry?',p6:'What does your divot usually look like?',p7:'How do you use each wedge?',p8:'What are your typical fairway and bunker conditions?',p9:'How confident are you from greenside bunkers?',unknown:'I don’t know',dist:'Enter distance',nodist:'I don’t know the distance',carry:'Full-swing carry (yd)',select:'Select',firm:'Firm',sfirm:'Slightly Firm',normal:'Normal',ssoft:'Slightly Soft',soft:'Soft',steep:'Steeper / Digger',neutral:'Neutral / Average',shallow:'Shallow / Sweeper',full:'Full Swing',green:'Around Green',open:'Open Face',bunker:'Greenside Bunker',vlow:'Very Unconfident',low:'Slightly Unconfident',conf:'Neutral',high:'Confident',vhigh:'Very Confident',result:'YOUR WEDGE SET',profile:'YOUR SWING PROFILE',why:'WHY THIS SET',dna:'YOUR WEDGE DNA',standard:'STANDARD GAPPING MODE',cal:'CALIBRATED DISTANCE MODE'},ko:{back:'← 이전',next:'다음 질문',p1:'어떤 JP Wedge로 피팅하시겠습니까?',p2:'웨지를 몇 개로 구성하고 싶으신가요?',p3:'평균 스코어를 알려주세요.',p4:'현재 피칭 웨지 로프트는?',p5:'가장 높은 로프트는?',p6:'풀 스윙 웨지 샷의 디봇은?',p7:'웨지별로 어떤 샷을 사용하나요?',p8:'페어웨이와 벙커 컨디션은?',p9:'벙커 샷에 얼마나 자신이 있나요?',unknown:'잘 모르겠습니다',dist:'거리 입력',nodist:'거리 모름',carry:'풀스윙 캐리 (yd)',select:'선택',firm:'단단함',sfirm:'약간 단단함',normal:'보통',ssoft:'약간 부드러움',soft:'부드러움',steep:'찍어치는 타입',neutral:'일반적인 타입',shallow:'쓸어치는 타입',full:'풀 스윙',green:'그린 주변',open:'오픈 페이스',bunker:'그린사이드 벙커',vlow:'매우 불안',low:'약간 불안',conf:'보통',high:'약간 자신',vhigh:'매우 자신',result:'YOUR WEDGE SET',profile:'YOUR SWING PROFILE',why:'WHY THIS SET',dna:'YOUR WEDGE DNA',standard:'STANDARD GAPPING MODE',cal:'CALIBRATED DISTANCE MODE'},ja:{back:'← 戻る',next:'次へ',p1:'どのJP Wedgeでフィッティングしますか？',p2:'ウェッジを何本で構成しますか？',p3:'平均スコアを教えてください。',p4:'現在のPWロフトは？',p5:'使用したい最大ロフトは？',p6:'普段のディボットは？',p7:'各ウェッジをどのショットに使いますか？',p8:'フェアウェイとバンカーの状態は？',p9:'バンカーショットにどの程度自信がありますか？',unknown:'わかりません',dist:'距離を入力',nodist:'距離がわからない',carry:'フルスイング キャリー (yd)',select:'選択',firm:'硬い',sfirm:'やや硬い',normal:'標準',ssoft:'やや柔らかい',soft:'柔らかい',steep:'打ち込みが強い',neutral:'標準',shallow:'払い打ち',full:'フルスイング',green:'グリーン周り',open:'オープンフェース',bunker:'グリーンサイドバンカー',vlow:'非常に不安',low:'やや不安',conf:'普通',high:'やや自信あり',vhigh:'非常に自信あり',result:'YOUR WEDGE SET',profile:'YOUR SWING PROFILE',why:'WHY THIS SET',dna:'YOUR WEDGE DNA',standard:'STANDARD GAPPING MODE',cal:'CALIBRATED DISTANCE MODE'},zh:{back:'← 返回',next:'下一题',p1:'你想使用哪一款 JP Wedge？',p2:'你希望配置几支挖起杆？',p3:'你的平均杆数是多少？',p4:'你目前的 PW 是多少度？',p5:'你希望使用的最高 Loft 是多少？',p6:'你的草痕通常是哪一种？',p7:'你会用每支挖起杆打哪些球？',p8:'你常见的球道和沙坑条件如何？',p9:'你对沙坑球有多大信心？',unknown:'不知道',dist:'输入距离',nodist:'不知道距离',carry:'全挥杆 Carry (yd)',select:'选择',firm:'硬',sfirm:'较硬',normal:'一般',ssoft:'较软',soft:'软',steep:'陡直 / 深挖型',neutral:'中性 / 标准型',shallow:'浅扫型',full:'全挥杆',green:'果岭周边',open:'打开杆面',bunker:'果岭边沙坑',vlow:'非常没信心',low:'有些没信心',conf:'一般',high:'比较有信心',vhigh:'非常有信心',result:'YOUR WEDGE SET',profile:'YOUR SWING PROFILE',why:'WHY THIS SET',dna:'YOUR WEDGE DNA',standard:'STANDARD GAPPING MODE',cal:'CALIBRATED DISTANCE MODE'}};
let lang=localStorage.getItem('jpwl')||'en',step=0;const S={product:null,count:null,score:null,pw:null,pwCarry:null,pwUnknown:false,hi:null,hiCarry:null,hiUnknown:false,divot:null,shots:{},fairway:null,bunker:null,conf:null};const rows=['PW','GW','SW','LW'],cols=['Full Swing','Around Green','Open Face','Greenside Bunker'];
function t(){return I[lang]} function setLang(x){lang=x;localStorage.setItem('jpwl',x);render()} function sel(a,b){return String(a)===String(b)?'sel':''} function num(v){v=parseFloat(v);return Number.isFinite(v)?v:null} function epw(){return S.pw==='unknown'?44:parseInt(S.pw)} function ref(l){return 140-(l-46)*(40/12)} function mode(){return !S.pwUnknown&&!S.hiUnknown?'two':S.pwUnknown&&S.hiUnknown?'zero':'one'} function resolve(){let p=epw(),h=parseInt(S.hi),rp=ref(p),rh=ref(h),pd=S.pwUnknown?null:num(S.pwCarry),hd=S.hiUnknown?null:num(S.hiCarry);if(pd==null&&hd!=null){let s=hd/rh;pd=rp*s}else if(pd!=null&&hd==null){let s=pd/rp;hd=rh*s}else if(pd==null&&hd==null){pd=rp;hd=rh}return{p,h,rp,rh,pd,hd}} function pred(l){let r=resolve(),rl=ref(l);if(mode()==='two'){let q=(r.rp-rl)/(r.rp-r.rh);return r.pd+q*(r.hd-r.pd)}return rl*(r.pd/r.rp)}
function firmness(v){return {'firm':-2,'sfirm':-1,'normal':0,'ssoft':1,'soft':2}[v]||0} function dscore(){return {'shallow':-2,'neutral':0,'steep':2}[S.divot]||0} function cscore(){return {'vlow':2,'low':1,'conf':0,'high':-1,'vhigh':-2}[S.conf]||0} function use(r,c){return !!S.shots[r+'|'+c]} function role(set,l){let i=set.indexOf(l);return i===set.length-1?'LW':i===set.length-2?'SW':'GW'} function bounce(r,l){let s=dscore()+firmness(S.fairway);if(r==='SW'||r==='LW')s+=firmness(S.bunker)*.7+cscore()*0.6;if(r==='LW'&&(use('LW','Open Face')||use('LW','Around Green')))s-=1.6;let raw=l<58?(s>=1.2?'HIGH':'MID'):(s<=-1.2?'LOW':s>=1.4?'HIGH':'MID');if(S.product==='JP Premier'&&raw==='LOW')raw='MID';if(S.product==='JP Camber'&&raw==='LOW'&&!( [58,60].includes(l) && use(r,'Open Face')))raw='MID';return raw}
function comb(a,k){let o=[];function f(i,c){if(c.length===k){o.push([...c]);return}for(let j=i;j<=a.length-(k-c.length);j++){c.push(a[j]);f(j+1,c);c.pop()}}f(0,[]);return o} function build(){let c=parseInt(S.count),p=epw(),h=parseInt(S.hi),a=DB[S.product].lofts.filter(x=>x>p&&x<=h);if(!a.includes(h)&&DB[S.product].lofts.includes(h))a.push(h);a=[...new Set(a)].sort((x,y)=>x-y);if(a.length<c)return null;if(c===1)return[h];let low=a.filter(x=>x!==h),cand=comb(low,c-1).map(x=>[...x,h].sort((m,n)=>m-n)),r=resolve(),target=(r.pd-r.hd)/c,best=null,bs=1e9;for(let set of cand){let pts=[r.pd,...set.map(pred)],sc=0;for(let i=1;i<pts.length;i++)sc+=(pts[i-1]-pts[i]-target)**2;if(sc<bs){bs=sc;best=set}}return best}
function render(){document.documentElement.lang=lang==='zh'?'zh-CN':lang;document.querySelectorAll('.langs button').forEach(b=>b.classList.toggle('on',b.dataset.l===lang));document.getElementById('back').textContent=t().back;document.getElementById('next').textContent=t().next;document.getElementById('back').style.visibility=step?'visible':'hidden';document.getElementById('bar').style.width=((step+1)/9*100)+'%';let h='',x=t();if(step===0)h=`<div class=step>01 / 09</div><div class=ey>SELECT PRODUCT</div><h1>${x.p1}</h1><div class=grid>${['JP Premier','JP Camber'].map(v=>`<button class="choice ${sel(S.product,v)}" onclick="S.product='${v}';render()"><b>${v}</b>${v==='JP Premier'?'MID / HIGH':'MID / HIGH · LOW on 58°/60° with Open Face'}</button>`).join('')}</div>`;if(step===1)h=`<div class=step>02 / 09</div><div class=ey>WEDGE SET SIZE</div><h1>${x.p2}</h1><div class=grid>${[2,3,4].map(v=>`<button class="choice ${sel(S.count,v)}" onclick="S.count=${v};render()"><b>${v}</b></button>`).join('')}</div>`;if(step===2){let a=['+100','100-95','95-90','90-85','85-80','80-75','75-72','71 ~'];h=`<div class=step>03 / 09</div><div class=ey>PLAYER LEVEL</div><h1>${x.p3}</h1><select class=select onchange="S.score=this.value"><option value="">${x.select}</option>${a.map(v=>`<option ${S.score===v?'selected':''}>${v}</option>`).join('')}</select>`}if(step===3){let a=['43','44','45','46','47','48','unknown'];h=`<div class=step>04 / 09</div><div class=ey>CURRENT PW</div><h1>${x.p4}</h1><div class=grid>${a.map(v=>`<button class="choice ${sel(S.pw,v)}" onclick="S.pw='${v}';render()">${v==='unknown'?x.unknown:v+'°'}</button>`).join('')}</div><div class=grid><button class="choice ${!S.pwUnknown?'sel':''}" onclick="S.pwUnknown=false;render()">${x.dist}</button><button class="choice ${S.pwUnknown?'sel':''}" onclick="S.pwUnknown=true;S.pwCarry='';render()">${x.nodist}</button></div>${S.pwUnknown?'':`<input class=input type=number placeholder="${x.carry}" value="${S.pwCarry||''}" oninput="S.pwCarry=this.value">`}`};if(step===4){let a=[48,50,52,54,55,56,58,60];h=`<div class=step>05 / 09</div><div class=ey>HIGHEST LOFT</div><h1>${x.p5}</h1><div class=grid>${a.map(v=>`<button class="choice ${sel(S.hi,v)}" onclick="S.hi=${v};render()">${v}°</button>`).join('')}</div><div class=grid><button class="choice ${!S.hiUnknown?'sel':''}" onclick="S.hiUnknown=false;render()">${x.dist}</button><button class="choice ${S.hiUnknown?'sel':''}" onclick="S.hiUnknown=true;S.hiCarry='';render()">${x.nodist}</button></div>${S.hiUnknown?'':`<input class=input type=number placeholder="${x.carry}" value="${S.hiCarry||''}" oninput="S.hiCarry=this.value">`}`};if(step===5)h=`<div class=step>06 / 09</div><div class=ey>TURF & DIVOT</div><h1>${x.p6}</h1><div class=grid>${[['steep',x.steep],['neutral',x.neutral],['shallow',x.shallow]].map(([v,n])=>`<button class="choice ${sel(S.divot,v)}" onclick="S.divot='${v}';render()"><b>${n}</b></button>`).join('')}</div>`;if(step===6){h=`<div class=step>07 / 09</div><div class=ey>SHOT USAGE</div><h1>${x.p7}</h1><div class=matrix><table><tr><th>WEDGE</th><th>${x.full}</th><th>${x.green}</th><th>${x.open}</th><th>${x.bunker}</th></tr>`;for(let r of rows){h+=`<tr><td>${r}</td>`;for(let c of cols){let k=r+'|'+c;h+=`<td><input type=checkbox ${S.shots[k]?'checked':''} onchange="S.shots['${k}']=this.checked"></td>`}h+='</tr>'}h+='</table></div>'}if(step===7){let a=[['firm',x.firm],['sfirm',x.sfirm],['normal',x.normal],['ssoft',x.ssoft],['soft',x.soft]];h=`<div class=step>08 / 09</div><div class=ey>COURSE CONDITIONS</div><h1>${x.p8}</h1><div class=box><b>Fairway</b><div class=grid>${a.map(([v,n])=>`<button class="choice ${sel(S.fairway,v)}" onclick="S.fairway='${v}';render()">${n}</button>`).join('')}</div></div><div class=box style="margin-top:14px"><b>Bunker</b><div class=grid>${a.map(([v,n])=>`<button class="choice ${sel(S.bunker,v)}" onclick="S.bunker='${v}';render()">${n}</button>`).join('')}</div></div>`}if(step===8){let a=[['vlow',x.vlow],['low',x.low],['conf',x.conf],['high',x.high],['vhigh',x.vhigh]];h=`<div class=step>09 / 09</div><div class=ey>BUNKER CONFIDENCE</div><h1>${x.p9}</h1><div class=grid>${a.map(([v,n])=>`<button class="choice ${sel(S.conf,v)}" onclick="S.conf='${v}';render()">${n}</button>`).join('')}</div>`}document.getElementById('panel').innerHTML=h}
function valid(){if(step===0)return !!S.product;if(step===1)return !!S.count;if(step===2)return !!S.score;if(step===3)return !!S.pw&&(S.pwUnknown||num(S.pwCarry)>0);if(step===4){if(!S.hi)return false;if(!S.hiUnknown&&!(num(S.hiCarry)>0))return false;if(!S.pwUnknown&&!S.hiUnknown&&!(num(S.hiCarry)<num(S.pwCarry)))return false;let a=DB[S.product].lofts.filter(x=>x>epw()&&x<=S.hi);return a.length>=S.count}if(step===5)return !!S.divot;if(step===6)return Object.values(S.shots).some(Boolean);if(step===7)return !!S.fairway&&!!S.bunker;if(step===8)return !!S.conf}function next(){if(!valid()){alert('Please complete a valid selection.');return}if(step<8){step++;render()}else show()}function prev(){if(step){step--;render()}}
function show(){let set=build();if(!set){alert('This loft range cannot support the selected wedge count. Please choose a higher maximum loft.');step=4;render();return}let r=resolve(),x=t(),recs=set.map(l=>{let rr=role(set,l);return{l,rr,b:bounce(rr,l),c:pred(l)}}),g=[],prev=r.pd;for(let z of recs){g.push(prev-z.c);prev=z.c}let target=(r.pd-r.hd)/S.count,err=g.reduce((a,v)=>a+Math.abs(v-target),0)/g.length,dist=Math.max(72,Math.min(98,96-err*2.2)),fit=Math.round(dist*.5+90*.5)-(mode()==='one'?8:mode()==='zero'?16:0);fit=Math.max(60,fit);document.getElementById('panel').classList.add('hidden');document.getElementById('actions').classList.add('hidden');let bars=[{n:`PW ${S.pw==='unknown'?'44°*':S.pw+'°'}`,c:r.pd},...recs.map(z=>({n:z.l+'°',c:z.c}))];document.getElementById('result').classList.remove('hidden');document.getElementById('result').innerHTML=`<div class=ey>${mode()==='zero'?x.standard:x.cal}</div><h1>${x.result}</h1><div class=metrics><div class=metric><small>PRODUCT</small><b>${S.product}</b></div><div class=metric><small>WEDGE COUNT</small><b>${S.count}</b></div><div class=metric><small>PW ANCHOR</small><b>${r.pd.toFixed(0)} yd${S.pwUnknown?'*':''}</b></div><div class=metric><small>HIGH ANCHOR</small><b>${r.hd.toFixed(0)} yd${S.hiUnknown?'*':''}</b></div></div><div class=box style="margin-top:16px"><b>DISTANCE GAP FLOW</b>${bars.map(v=>`<div class=barrow><span>${v.n}</span><div class=bar><span style="width:${Math.min(100,v.c/r.pd*100)}%"></span></div><b>${v.c.toFixed(1)}</b></div>`).join('')}</div><div class=cards>${recs.map((z,i)=>`<div class=card><div class=ey>${S.product.toUpperCase()} · ${z.rr}</div><div class=loft>${z.l}°</div><div>${z.c.toFixed(1)} yd</div><div class=bounce>${z.b} BOUNCE</div><p class=desc>${z.b==='HIGH'?'More digging resistance and turf stability.':z.b==='LOW'?'Open-face versatility and sole freedom.':'Balanced full-swing stability and short-game versatility.'}</p></div>`).join('')}</div><div class=box style="margin-top:16px"><div class=ey>${x.why}</div><h2>FIT CONFIDENCE · ${fit}/100</h2><p class=desc>${mode()==='two'?'Both carry anchors were used to calibrate the distance window.':mode()==='one'?'One actual carry anchor was used; the missing carry was estimated from JP Distance DB V1.':'No actual carry anchor was entered; standard JP distance gapping was used.'}</p></div><div class=box style="margin-top:16px"><div class=ey>${x.dna}</div><span class=tag>${S.divot.toUpperCase()}</span><span class=tag>${S.fairway.toUpperCase()} TURF</span><span class=tag>${S.count}-WEDGE BUILD</span><span class=tag>${S.product.toUpperCase()}</span></div><p class=note>* Estimated values are derived from the JP Distance DB V1 reference curve when actual carry is unknown.</p><button class=choice onclick="location.reload()">↺ Restart</button>`}
render();
</script></body></html>
